name: Test specific platforms input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: qemu
        uses: .
        with:
          platforms: arm64,arm
          cache-image: 'false'
      - name: Assert platforms output is non-empty
        env:
          PLATFORMS: ${{ steps.qemu.outputs.platforms }}
        run: |
          echo "platforms: $PLATFORMS"
          if [ -z "$PLATFORMS" ]; then
            echo "FAIL: expected platforms output to be non-empty"
            exit 1
          fi
          echo "PASS: platforms output is '$PLATFORMS'"
      - name: Assert arm64 is in platforms
        env:
          PLATFORMS: ${{ steps.qemu.outputs.platforms }}
        run: |
          echo "platforms: $PLATFORMS"
          if ! echo "$PLATFORMS" | grep -q "arm64"; then
            echo "FAIL: expected arm64 to be in platforms"
            exit 1
          fi
          echo "PASS: arm64 found in platforms"
