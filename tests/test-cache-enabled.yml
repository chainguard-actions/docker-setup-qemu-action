name: Test cache-image enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: qemu
        uses: .
        with:
          platforms: arm64
          cache-image: 'true'
        continue-on-error: true
      - name: Assert action ran and produced output or failed gracefully
        env:
          OUTCOME: ${{ steps.qemu.outcome }}
          PLATFORMS: ${{ steps.qemu.outputs.platforms }}
        run: |
          echo "outcome: $OUTCOME"
          echo "platforms: $PLATFORMS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PLATFORMS" ]; then
              echo "FAIL: action succeeded but platforms output is empty"
              exit 1
            fi
            echo "PASS: got platforms '$PLATFORMS'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache backend may not be available in act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
