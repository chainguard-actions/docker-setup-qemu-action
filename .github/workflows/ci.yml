name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'
  push:
    branches:
      - 'master'
      - 'releases/v*'
    tags:
      - 'v*'
  pull_request:

permissions: {}

jobs:
  default:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      -
        name: Set up QEMU
        id: qemu
        uses: ./
      -
        name: Available platforms
        env:
          PLATFORMS: ${{ steps.qemu.outputs.platforms }}
        run: echo "$PLATFORMS"

  main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - tonistiigi/binfmt:latest
          - tonistiigi/binfmt:master
        platforms:
          - all
          - arm64,riscv64,arm
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      -
        name: Set up QEMU
        id: qemu
        uses: ./
        with:
          image: ${{ matrix.image }}
          platforms: ${{ matrix.platforms }}
      -
        name: Available platforms
        env:
          PLATFORMS: ${{ steps.qemu.outputs.platforms }}
        run: echo "$PLATFORMS"

  error:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      -
        name: Stop docker
        run: |
          sudo systemctl stop docker docker.socket
      -
        name: Set up QEMU
        id: qemu
        continue-on-error: true
        uses: ./
      -
        name: Check
        env:
          QEMU_JSON: ${{ toJson(steps.qemu) }}
          QEMU_OUTCOME: ${{ steps.qemu.outcome }}
          QEMU_CONCLUSION: ${{ steps.qemu.conclusion }}
        run: |
          echo "$QEMU_JSON"
          if [ "$QEMU_OUTCOME" != "failure" ] || [ "$QEMU_CONCLUSION" != "success" ]; then
            echo "::error::Should have failed"
            exit 1
          fi

  cache-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cache:
          - true
          - false
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      -
        name: Set up QEMU
        id: qemu
        uses: ./
        with:
          image: tonistiigi/binfmt:master
          cache-image: ${{ matrix.cache }}
      -
        name: Available platforms
        env:
          PLATFORMS: ${{ steps.qemu.outputs.platforms }}
        run: echo "$PLATFORMS"

  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - tonistiigi/binfmt:master
          - tonistiigi/binfmt:latest
          - tonistiigi/binfmt:qemu-v7.0.0
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      -
        name: Set up QEMU
        uses: ./
        with:
          image: ${{ matrix.image }}
