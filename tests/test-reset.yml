name: Test reset before installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: First install (without reset)
        id: qemu-first
        uses: .
        with:
          platforms: arm64
          cache-image: false
      - name: Assert first install platforms output
        env:
          ACTUAL: ${{ steps.qemu-first.outputs.platforms }}
        run: |
          echo "first install platforms: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected platforms output to be non-empty after first install"
            exit 1
          fi
          echo "PASS: first install succeeded"
      - name: Second install with reset
        id: qemu-reset
        uses: .
        with:
          platforms: arm64
          reset: true
          cache-image: false
      - name: Assert reset install platforms output
        env:
          ACTUAL: ${{ steps.qemu-reset.outputs.platforms }}
        run: |
          echo "reset install platforms: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected platforms output to be non-empty after reset install"
            exit 1
          fi
          echo "PASS: reset install succeeded"
      - name: Assert linux/arm64 is in reset platforms
        env:
          ACTUAL: ${{ steps.qemu-reset.outputs.platforms }}
        run: |
          echo "actual platforms: $ACTUAL"
          if echo "$ACTUAL" | grep -q "linux/arm64"; then
            echo "PASS: linux/arm64 found in platforms after reset"
          else
            echo "FAIL: linux/arm64 not found in platforms after reset: $ACTUAL"
            exit 1
          fi
